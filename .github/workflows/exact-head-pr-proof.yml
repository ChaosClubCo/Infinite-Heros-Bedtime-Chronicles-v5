name: Exact Head PR Proof

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: exact-head-pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  EXACT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  exact-head-ci:
    name: Exact Head CI
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXACT_HEAD_SHA"
          printf 'candidate=%s\nactual=%s\n' "$EXACT_HEAD_SHA" "$actual_sha"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: |
          set -o pipefail
          npm ci 2>&1 | tee npm-ci.log

      - name: Run preflight
        env:
          CI: true
        run: |
          set -o pipefail
          npm run preflight 2>&1 | tee preflight.log

      - name: Run ESLint with zero warnings
        run: |
          set -o pipefail
          npm run lint -- --max-warnings=0 2>&1 | tee eslint.log

      - name: Run complete Vitest suite
        env:
          CI: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest.log

      - name: Run complete jest-expo component suite
        env:
          CI: true
        run: |
          set -o pipefail
          npm run test:components 2>&1 | tee jest-expo.log

      - name: Run typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Build server
        run: |
          set -o pipefail
          npm run server:build 2>&1 | tee server-build.log

      - name: Check Expo compatibility
        env:
          CI: true
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -o pipefail
          npm run expo:check 2>&1 | tee expo-check.log

      - name: Export Expo web build
        env:
          CI: true
          EXPO_NO_TELEMETRY: '1'
        run: |
          set -o pipefail
          npm run expo:build:ci 2>&1 | tee expo-build.log

      - name: Run high and critical dependency audit
        run: |
          set -o pipefail
          node scripts/audit-gate.mjs --evidence npm-audit.json

      - name: Record exact-head CI evidence
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('exact-head-ci.json', JSON.stringify({
            candidate: process.env.EXACT_HEAD_SHA,
            actual: require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            workflow: process.env.GITHUB_WORKFLOW,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            actor: process.env.GITHUB_ACTOR,
            recordedAt: new Date().toISOString(),
          }, null, 2));
          NODE

      - name: Upload exact-head CI evidence and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exact-head-ci-${{ env.EXACT_HEAD_SHA }}
          path: |
            exact-head-ci.json
            npm-ci.log
            preflight.log
            eslint.log
            vitest.log
            jest-expo.log
            typecheck.log
            server-build.log
            expo-check.log
            expo-build.log
            npm-audit.json
          if-no-files-found: error
          retention-days: 14

  exact-head-security-agent:
    name: Exact Head Security Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: npm ci

      - name: Run security agent
        run: node agents/security/index.js --output agents/security/exact-head-security-report.json

      - name: Upload exact-head security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exact-head-security-${{ env.EXACT_HEAD_SHA }}
          path: agents/security/exact-head-security-report.json
          if-no-files-found: error
          retention-days: 14

  exact-head-codeql:
    name: Exact Head CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.6
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.6

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.6
        with:
          upload: never
          output: exact-head-codeql-results

      - name: Upload exact-head CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: exact-head-codeql-${{ env.EXACT_HEAD_SHA }}
          path: exact-head-codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14

  exact-head-links:
    name: Exact Head Markdown Links
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Verify exact checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"

      - name: Run lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --cache
            --max-cache-age 7d
            --exclude-path attached_assets
            --exclude-path archive
            --exclude-path node_modules
            --exclude-path server_dist
            --exclude-path docs/adr/template.md
            --exclude-path mnt
            './**/*.md'
          fail: true

  exact-head-manifest:
    name: Exact Head Evidence Manifest
    if: always()
    needs: [exact-head-ci, exact-head-security-agent, exact-head-codeql, exact-head-links]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout exact pull-request head
        uses: actions/checkout@v7
        with:
          ref: ${{ env.EXACT_HEAD_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXACT_HEAD_SHA"

      - name: Record workflow gate receipts
        env:
          CI_RESULT: ${{ needs.exact-head-ci.result }}
          SECURITY_RESULT: ${{ needs.exact-head-security-agent.result }}
          CODEQL_RESULT: ${{ needs.exact-head-codeql.result }}
          LINKS_RESULT: ${{ needs.exact-head-links.result }}
        run: |
          mkdir -p .release-evidence/receipts
          node <<'NODE'
          const fs = require('node:fs');
          const common = {
            candidateSha: process.env.EXACT_HEAD_SHA,
            executedAt: new Date().toISOString(),
            source: {
              provider: 'github-actions',
              uri: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              workflowRunId: process.env.GITHUB_RUN_ID,
              workflowRunAttempt: process.env.GITHUB_RUN_ATTEMPT,
            },
          };
          const results = [
            ['BR-01', process.env.CI_RESULT],
            ['BR-02', process.env.CI_RESULT],
            ['BR-03', process.env.SECURITY_RESULT],
            ['BR-04', process.env.CODEQL_RESULT],
            ['BR-05', process.env.LINKS_RESULT],
          ];
          for (const [gateId, result] of results) {
            const status = result === 'success' ? 'PASS' : 'BLOCKED';
            fs.writeFileSync(`.release-evidence/receipts/${gateId}.json`, JSON.stringify({ ...common, gateId, status, result }, null, 2));
          }
          NODE

      - name: Generate and structurally verify SHA-bound manifest
        run: |
          node scripts/generate-beta-readiness.mjs
          node scripts/verify-beta-readiness.mjs --allow-blocked

      - name: Upload SHA-bound release evidence
        uses: actions/upload-artifact@v7
        with:
          name: beta-acceptance-${{ env.EXACT_HEAD_SHA }}
          path: .release-evidence/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true

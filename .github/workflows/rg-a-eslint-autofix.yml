name: RG-A ESLint Autofix

on:
  push:
    branches:
      - repair/rg-a-rg-b-baseline
    paths:
      - .github/workflows/rg-a-eslint-autofix.yml

permissions:
  contents: write

concurrency:
  group: rg-a-eslint-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: repair/rg-a-rg-b-baseline
          fetch-depth: 0

      - name: Setup repository Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: npm ci

      - name: Apply deterministic ESLint autofixes
        run: npm run lint:fix || true

      - name: Normalize autofix whitespace
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/[[:space:]]\+$//' __tests__/release-provenance.test.ts api/server.mjs server/validation.ts

      - name: Reject malformed patch output
        run: git diff --check

      - name: Protect manifests and lockfile
        run: git diff --exit-code -- package.json package-lock.json

      - name: Commit autofixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No autofixable changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(rg-a): apply deterministic ESLint autofixes"
          git push origin HEAD:repair/rg-a-rg-b-baseline

      - name: Record remaining zero-warning debt
        run: npm run lint -- --max-warnings=0

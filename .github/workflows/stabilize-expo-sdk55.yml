name: Stabilize Expo SDK 55

on:
  push:
    branches:
      - agent/resolve-release-blockers
    paths:
      - .github/workflows/stabilize-expo-sdk55.yml

permissions:
  contents: write

concurrency:
  group: stabilize-expo-sdk55
  cancel-in-progress: false

jobs:
  stabilize:
    name: Reconcile the complete Expo dependency graph
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: agent/resolve-release-blockers
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install current locked graph
        run: bash scripts/npm-ci-retry.sh stabilize-before.log

      - name: Reconcile every package to Expo SDK 55
        run: npx expo install --fix

      - name: Verify reconciled graph
        run: npm run expo:check

      - name: Verify production Expo export
        run: npm run expo:build:ci

      - name: Show controlled migration
        run: git diff --stat && git diff -- package.json

      - name: Commit package manifest and lockfile together
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Expo dependency graph already reconciled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: reconcile dependencies to Expo SDK 55"
          git push origin HEAD:agent/resolve-release-blockers

      - name: Upload reconciled dependency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expo-sdk55-reconciled-dependencies
          path: |
            package.json
            package-lock.json
            static-build/
            stabilize-before.log
          retention-days: 14

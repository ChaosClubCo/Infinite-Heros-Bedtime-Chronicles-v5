name: Sync received-alert evidence input

on:
  push:
    branches:
      - release/exact-sha-remediation-2026-07-18
    paths:
      - .github/workflows/sync-alert-evidence-input.yml

permissions:
  contents: write

concurrency:
  group: sync-alert-evidence-input
  cancel-in-progress: false

jobs:
  patch-release-proof:
    name: Require received alert evidence for finalization
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout consolidation branch
        uses: actions/checkout@v7
        with:
          ref: release/exact-sha-remediation-2026-07-18
          fetch-depth: 0

      - name: Patch exact release-proof evidence fields
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/release-proof.yml')
          text = path.read_text()
          if 'alert_notification_evidence_url:' in text:
              print('received-alert input already present')
              raise SystemExit(0)

          replacements = [
              (
                  '''      physical_device_evidence_url:\n        description: Private evidence URL for the completed device matrix (finalize only)\n        required: false\n        type: string\n      backup_restore_evidence_url:''',
                  '''      physical_device_evidence_url:\n        description: Private evidence URL for the completed device matrix (finalize only)\n        required: false\n        type: string\n      alert_notification_evidence_url:\n        description: Private evidence URL proving the alert notification was received (finalize only)\n        required: false\n        type: string\n      backup_restore_evidence_url:''',
              ),
              (
                  '''          DEVICE_EVIDENCE: ${{ inputs.physical_device_evidence_url }}\n          BACKUP_EVIDENCE: ${{ inputs.backup_restore_evidence_url }}\n          ROLLBACK_EVIDENCE: ${{ inputs.rollback_evidence_url }}''',
                  '''          DEVICE_EVIDENCE: ${{ inputs.physical_device_evidence_url }}\n          ALERT_NOTIFICATION_EVIDENCE: ${{ inputs.alert_notification_evidence_url }}\n          BACKUP_EVIDENCE: ${{ inputs.backup_restore_evidence_url }}\n          ROLLBACK_EVIDENCE: ${{ inputs.rollback_evidence_url }}''',
              ),
              (
                  '''            physicalDeviceEvidenceUrl: process.env.DEVICE_EVIDENCE,\n            backupRestoreEvidenceUrl: process.env.BACKUP_EVIDENCE,''',
                  '''            physicalDeviceEvidenceUrl: process.env.DEVICE_EVIDENCE,\n            alertNotificationEvidenceUrl: process.env.ALERT_NOTIFICATION_EVIDENCE,\n            backupRestoreEvidenceUrl: process.env.BACKUP_EVIDENCE,''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'expected release-proof fragment not found: {old!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Validate workflow syntax with repository parser
        run: |
          npm ci
          node -e "require('yaml').parse(require('node:fs').readFileSync('.github/workflows/release-proof.yml','utf8'))"

      - name: Commit only the release-proof workflow
        run: |
          if git diff --quiet -- .github/workflows/release-proof.yml; then
            echo "release-proof workflow already synchronized"
            exit 0
          fi
          test "$(git diff --name-only | wc -l)" -eq 1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release-proof.yml
          git commit -m "fix(release): require received-alert evidence"
          git push origin HEAD:release/exact-sha-remediation-2026-07-18

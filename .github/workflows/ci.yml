name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Minimal permissions — this workflow reads code and uploads diagnostic/build artifacts.
permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install dependencies and verify lockfile integrity
        id: npm-ci
        # `npm ci` remains strict. The helper retries transient registry/cache
        # failures but a deterministic manifest/lockfile error fails every attempt.
        run: bash scripts/npm-ci-retry.sh npm-ci.log

      - name: Upload npm install diagnostics
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: npm-ci-diagnostics
          path: npm-ci.log
          retention-days: 7

      - name: Generate synchronized lockfile diagnostic
        if: failure() && steps.npm-ci.outcome == 'failure'
        run: npm install --package-lock-only --ignore-scripts

      - name: Upload synchronized lockfile diagnostic
        if: failure() && steps.npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: synchronized-package-lock
          path: package-lock.json
          retention-days: 7

      - name: Run preflight checks
        run: npm run preflight
        # Only validates Node version and patch consistency in CI (no env vars required).
        # The env-var section warns but does not fail when keys are absent.

      - name: Run ESLint
        id: eslint
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee eslint.log

      - name: Upload ESLint diagnostics
        if: failure() && steps.eslint.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: eslint-diagnostics
          path: eslint.log
          retention-days: 7

      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee tests.log
        env:
          CI: true

      - name: Upload test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: test-diagnostics
          path: tests.log
          retention-days: 7

      - name: Security audit
        # Fail on critical vulnerabilities only; high-severity issues in transitive
        # deps (drizzle-orm, firebase-admin chain) require breaking-change upgrades
        # and are tracked separately in Dependabot.
        run: npm audit --audit-level=critical

      - name: Type check
        id: typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload typecheck diagnostics
        if: failure() && steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: typecheck-diagnostics
          path: typecheck.log
          retention-days: 7

  production-install-smoke:
    name: Production Install Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Simulate Vercel production install (omit devDependencies)
        run: npm install --omit=dev

      - name: Verify postinstall did not fail
        run: echo "Production install succeeded — postinstall is safe to run without devDependencies"

  build-server:
    name: Build Server
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install dependencies
        id: build-npm-ci
        run: bash scripts/npm-ci-retry.sh build-npm-ci.log

      - name: Upload build install diagnostics
        if: failure() && steps.build-npm-ci.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: build-npm-ci-diagnostics
          path: build-npm-ci.log
          retention-days: 7

      - name: Build server
        run: npm run server:build

      - name: Upload server build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: server-build
          path: server_dist/
          retention-days: 7

  expo-compatibility-build:
    name: Expo Compatibility and Web Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      CI: true
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: bash scripts/npm-ci-retry.sh expo-npm-ci.log

      - name: Verify Expo SDK dependency compatibility
        run: npm run expo:check

      - name: Export production web bundle
        run: npm run expo:build:ci

      - name: Upload Expo web bundle
        uses: actions/upload-artifact@v7
        with:
          name: expo-web-build
          path: static-build/
          retention-days: 7

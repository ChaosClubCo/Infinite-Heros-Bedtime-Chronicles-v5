name: Vercel Deploy Hook

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  HEALTH_CHECK_URL: "https://www.bedtime-chronicles.com/api/health"
  VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

jobs:
  trigger-vercel-deploy:
    name: Trigger Vercel Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Check Vercel deploy hook configuration
        id: check-hook
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip deployment when deploy hook is missing
        if: ${{ steps.check-hook.outputs.configured != 'true' }}
        run: echo "⚠️ VERCEL_DEPLOY_HOOK_URL is not configured; skipping deployment trigger"

      - name: Trigger Vercel Deploy Hook
        if: ${{ steps.check-hook.outputs.configured == 'true' }}
        run: |
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
      
      - name: Notify deployment triggered
        if: ${{ steps.check-hook.outputs.configured == 'true' }}
        run: echo "✅ Vercel deployment triggered successfully"

      - name: Wait for the NEW deployment to go live (health check)
        if: ${{ steps.check-hook.outputs.configured == 'true' }}
        env:
          # Passed via env (not inlined) per workflow-injection hardening. github.sha
          # is a 40-hex commit id, but keep the safe pattern regardless.
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # The production alias keeps serving the PREVIOUS deployment until the new
          # build finishes and promotes. A fixed sleep + status check therefore green-
          # lights the old deployment (and can't catch a broken build). Instead poll
          # /api/health until it reports releaseSha == the commit we just deployed.
          expected_short="${EXPECTED_SHA:0:7}"
          echo "🔍 Waiting for $HEALTH_CHECK_URL to report releaseSha ${expected_short}..."
          deadline=$(( SECONDS + 600 ))   # up to 10 minutes
          attempt=0
          saw_sha=false
          last_status=""
          last_sha=""
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$(( attempt + 1 ))
            body=$(curl -s --max-time 15 "$HEALTH_CHECK_URL" || echo '')
            last_status=$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || echo '')
            last_sha=$(printf '%s' "$body" | jq -r '.releaseSha // empty' 2>/dev/null || echo '')
            last_repo=$(printf '%s' "$body" | jq -r '.releaseRepo // empty' 2>/dev/null || echo '')
            [ -n "$last_sha" ] && saw_sha=true
            echo "Attempt $attempt: status=${last_status:-none} releaseSha=${last_sha:-none} releaseRepo=${last_repo:-none}"
            if [ "$last_status" = "ok" ] && [ "${last_sha:0:7}" = "$expected_short" ]; then
              # Provenance guard: a matching SHA built from a non-canonical repo
              # (mirror/fork) must never pass the production gate.
              if [ -n "$last_repo" ] && [ "$last_repo" != "ChaosClubCo/Infinite-Heros-Bedtime-Chronicles-v5" ]; then
                echo "❌ Deployment reports non-canonical source repository: ${last_repo}"
                exit 1
              fi
              echo "✅ New deployment (${expected_short}) is live and healthy"
              exit 0
            fi
            sleep 20
          done
          # Timed out. If the endpoint is up but never exposed a releaseSha, sha
          # tracking isn't configured on Vercel — fall back to a basic health pass
          # rather than blocking deploys. If we DID see a sha that never matched,
          # the new build is stuck or unhealthy → fail.
          if [ "$saw_sha" = "false" ] && [ "$last_status" = "ok" ]; then
            echo "⚠️ releaseSha not exposed by the server; passing on basic health only."
            echo "   (Set APP_RELEASE_SHA or enable Vercel system env vars for a precise gate.)"
            exit 0
          fi
          echo "❌ Timed out waiting for deployment ${expected_short} to become healthy"
          echo "   (last status: ${last_status:-none}, last releaseSha: ${last_sha:-none})"
          exit 1

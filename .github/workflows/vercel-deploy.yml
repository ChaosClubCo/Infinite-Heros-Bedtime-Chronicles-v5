name: Vercel Deploy Hook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vercel-deploy
  cancel-in-progress: true

env:
  HEALTH_CHECK_URL: "https://www.bedtime-chronicles.com/api/health"
  PRIVACY_URL: "https://www.bedtime-chronicles.com/privacy"
  VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

jobs:
  # The 'secrets' context is NOT available in a job-level 'if:'. Referencing it there
  # makes GitHub reject the entire workflow at PARSE time: the run fails in ~0s and is
  # listed by file path rather than by its 'name:'. The supported way to gate a job on a
  # secret is a preflight job that reads it through step-level 'env:' and publishes a
  # job output.
  check-secret:
    name: Check Vercel deploy hook secret availability
    runs-on: ubuntu-latest
    outputs:
      has-hook: ${{ steps.check.outputs.has-hook }}
    steps:
      - name: Check for VERCEL_DEPLOY_HOOK_URL secret
        id: check
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK_URL" ]; then
            echo "has-hook=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-hook=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_DEPLOY_HOOK_URL is not set - skipping the production deploy trigger. This workflow will not deploy anything. See docs/adr/0007-hook-only-vercel-deployment.md."
          fi

  trigger-vercel-deploy:
    name: Trigger and verify canonical Vercel production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check-secret
    # BRANCH-PROTECTION HAZARD: a SKIPPED job counts as PASSING for required status
    # checks. If this workflow is ever added as a required check, an unset secret would
    # render green while deploying nothing. deployment-drift.yml is the backstop - it
    # detects production diverging from main regardless of which trigger failed or why.
    if: needs.check-secret.outputs.has-hook == 'true'

    steps:
      - name: Checkout triggering candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Trigger canonical main deployment
        run: curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Wait for exact canonical candidate and privacy notice
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          attempt=0
          last_status=""
          last_sha=""
          last_repo=""
          last_ref=""

          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            rm -f health.json health-headers.txt privacy.html privacy-headers.txt

            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' -D health-headers.txt \
              "$HEALTH_CHECK_URL" --output health.json; then
              last_status=$(jq -r '.status // empty' health.json)
              last_sha=$(jq -r '.releaseSha // empty' health.json)
              last_repo=$(jq -r '.releaseRepo // empty' health.json)
              last_ref=$(jq -r '.releaseRef // empty' health.json)
            else
              last_status=""
              last_sha=""
              last_repo=""
              last_ref=""
            fi

            echo "Attempt $attempt: status=${last_status:-none} sha=${last_sha:-none} repo=${last_repo:-none} ref=${last_ref:-none}"

            if [ "$last_status" = "ok" ] && [ "$last_sha" = "$EXPECTED_SHA" ]; then
              EXPECTED_RELEASE_SHA="$EXPECTED_SHA" \
              DEPLOYED_RELEASE_SHA="$last_sha" \
              DEPLOYED_RELEASE_REPO="$last_repo" \
              DEPLOYED_RELEASE_REF="$last_ref" \
                node scripts/verify-release-provenance.mjs --phase release-gate

              grep -Eiq '^cache-control:.*no-store' health-headers.txt

              curl --fail --silent --show-error --location --max-time 20 \
                -H 'Cache-Control: no-cache' -D privacy-headers.txt \
                "$PRIVACY_URL" --output privacy.html
              test -s privacy.html
              grep -Eiq '^cache-control:.*no-store' privacy-headers.txt
              grep -Fq '<h1>Privacy Policy</h1>' privacy.html

              echo "Canonical production deployment verified at $EXPECTED_SHA"
              exit 0
            fi

            sleep 20
          done

          echo "Timed out waiting for exact canonical production deployment" >&2
          echo "last status=${last_status:-none} sha=${last_sha:-none} repo=${last_repo:-none} ref=${last_ref:-none}" >&2
          exit 1

      - name: Upload deployment verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-deployment-verification-${{ github.sha }}
          path: |
            health.json
            health-headers.txt
            privacy.html
            privacy-headers.txt
          if-no-files-found: warn
          retention-days: 90

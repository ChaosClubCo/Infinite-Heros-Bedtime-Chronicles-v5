name: Vercel Deploy Hook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-vercel-deploy
  cancel-in-progress: true

env:
  HEALTH_CHECK_URL: "https://www.bedtime-chronicles.com/api/health"
  PRIVACY_URL: "https://www.bedtime-chronicles.com/privacy"
  VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}

jobs:
  # Do NOT gate this job on the presence of the deploy-hook secret.
  #
  # Two patterns have already failed here and neither should be reintroduced:
  #
  #  1. `if: ${{ secrets.VERCEL_DEPLOY_HOOK_URL != '' }}` at JOB level. The 'secrets'
  #     context is not available in `jobs.<job_id>.if` (only github/needs/vars/inputs
  #     are), so GitHub rejects the whole workflow at PARSE time - the run fails in ~0s
  #     and is listed by file path instead of by 'name:'. Nothing deploys.
  #
  #  2. A preflight job publishing a has-hook output, with this job skipped when the
  #     secret is missing. That parses, but GitHub counts a SKIPPED job as PASSING, so
  #     the run reports SUCCESS while deploying nothing and verifying nothing. Run
  #     31750113790 did exactly that: check-secret succeeded, this job was skipped, the
  #     run went green in 9s. A silent green on a release gate is worse than a red X.
  #
  # A missing secret means the release pipeline is broken. Fail loudly (see the
  # "Require Vercel deploy hook configuration" step below). If a genuine off-switch is
  # ever wanted, gate on a repository VARIABLE - `vars` IS available in job-level `if:`,
  # e.g. `if: vars.ENABLE_VERCEL_DEPLOY == 'true'` - which is explicit and auditable.
  trigger-vercel-deploy:
    name: Trigger and verify canonical Vercel production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check-secret
    if: needs.check-secret.outputs.has-hook == 'true'

    steps:
      - name: Checkout triggering candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out candidate
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Require Vercel deploy hook configuration
        run: |
          if [ -z "${VERCEL_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error title=Deploy hook not configured::VERCEL_DEPLOY_HOOK_URL is unset, so production was NOT deployed by this workflow. Set it under Settings > Secrets and variables > Actions > *Repository secrets* (an Environment secret or a Variable will not be visible here). See docs/adr/0007-hook-only-vercel-deployment.md."
            exit 1
          fi

      # --retry-all-errors so a transient 5xx from api.vercel.com does not silently skip
      # a production deploy; --max-time so a hung POST cannot eat the job timeout.
      - name: Trigger canonical main deployment
        run: |
          curl --fail --silent --show-error \
            --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Wait for exact canonical candidate and privacy notice
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          attempt=0
          last_status=""
          last_sha=""
          last_repo=""
          last_ref=""

          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            rm -f health.json health-headers.txt privacy.html privacy-headers.txt

            # `set -e` is on, so a bare `last_x=$(jq ...)` would ABORT the whole step the
            # first time the endpoint returns a non-JSON 200 (a CDN/WAF interstitial, a
            # Vercel rollout placeholder, an empty body). That is exactly the transient
            # state this 900s loop exists to ride out. Validating the document inside the
            # `if` condition keeps a malformed response non-fatal - commands in an `if`
            # test are exempt from `set -e` - so we retry instead of dying.
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Accept: application/json' -H 'Cache-Control: no-cache' \
              -D health-headers.txt "$HEALTH_CHECK_URL" --output health.json \
              && jq -e . health.json >/dev/null 2>&1; then
              last_status=$(jq -r '.status // empty' health.json)
              last_sha=$(jq -r '.releaseSha // empty' health.json)
              last_repo=$(jq -r '.releaseRepo // empty' health.json)
              last_ref=$(jq -r '.releaseRef // empty' health.json)
            else
              last_status=""
              last_sha=""
              last_repo=""
              last_ref=""
            fi

            echo "Attempt $attempt: status=${last_status:-none} sha=${last_sha:-none} repo=${last_repo:-none} ref=${last_ref:-none}"

            if [ "$last_status" = "ok" ] && [ "$last_sha" = "$EXPECTED_SHA" ]; then
              EXPECTED_RELEASE_SHA="$EXPECTED_SHA" \
              DEPLOYED_RELEASE_SHA="$last_sha" \
              DEPLOYED_RELEASE_REPO="$last_repo" \
              DEPLOYED_RELEASE_REF="$last_ref" \
                node scripts/verify-release-provenance.mjs --phase release-gate

              grep -Eiq '^cache-control:.*no-store' health-headers.txt

              curl --fail --silent --show-error --location --max-time 20 \
                -H 'Cache-Control: no-cache' -D privacy-headers.txt \
                "$PRIVACY_URL" --output privacy.html
              test -s privacy.html
              grep -Eiq '^cache-control:.*no-store' privacy-headers.txt
              grep -Fq '<h1>Privacy Policy</h1>' privacy.html

              echo "Canonical production deployment verified at $EXPECTED_SHA"
              exit 0
            fi

            sleep 20
          done

          echo "Timed out waiting for exact canonical production deployment" >&2
          echo "last status=${last_status:-none} sha=${last_sha:-none} repo=${last_repo:-none} ref=${last_ref:-none}" >&2
          exit 1

      - name: Upload deployment verification diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-deployment-verification-${{ github.sha }}
          path: |
            health.json
            health-headers.txt
            privacy.html
            privacy-headers.txt
          if-no-files-found: warn
          retention-days: 90

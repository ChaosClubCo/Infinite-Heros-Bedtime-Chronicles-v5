name: Agent - Security

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-agent:
    name: Security Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Align npm with repo engines (npm 11.x)
        run: npm i -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Run security agent
        run: node agents/security/index.js --output agents/security/security-report.json

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-agent-report
          path: agents/security/security-report.json
          retention-days: 14

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    # CodeQL analysis is retained as a SARIF artifact because GitHub Code
    # Security is not enabled for this private repository. Uploading to code
    # scanning remains approval/cost gated; analysis failures still fail closed.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.3

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.3
        with:
          upload: never
          output: codeql-results

      - name: Upload CodeQL SARIF
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codeql-sarif
          path: codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 14

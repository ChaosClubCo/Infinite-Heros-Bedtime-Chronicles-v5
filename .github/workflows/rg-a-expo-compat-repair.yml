name: RG-A Expo Compatibility Repair

on:
  push:
    branches:
      - repair/rg-a-rg-b-baseline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/rg-a-rg-b-baseline
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install locked baseline
        run: npm ci

      - name: Align Expo SDK 55 package matrix
        shell: bash
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1
        run: |
          set -euo pipefail
          npx expo install --fix
          git diff --check
          changed="$(git diff --name-only | sort)"
          printf 'Changed files:\n%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(package.json|package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected Expo repair changes:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

      - name: Verify compatibility and core gates
        shell: bash
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1
        run: |
          set -euo pipefail
          npm run expo:check
          npm run lint -- --max-warnings=0
          npm test
          npm run test:components
          npm run typecheck
          npm run server:build

      - name: Commit verified Expo compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "fix(rg-a): align Expo SDK 55 package matrix"
          git push origin HEAD:repair/rg-a-rg-b-baseline

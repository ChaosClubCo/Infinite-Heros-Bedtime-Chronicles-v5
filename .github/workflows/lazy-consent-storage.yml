name: Lazy consent storage delegation

on:
  push:
    branches:
      - release/exact-sha-remediation-2026-07-18

permissions:
  contents: write

concurrency:
  group: lazy-consent-storage
  cancel-in-progress: false

jobs:
  patch-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/exact-sha-remediation-2026-07-18
          fetch-depth: 1

      - name: Replace eager native import with lazy delegation
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('lib/storage.ts')
          source = path.read_text()

          eager = """import {
            getConsentGiven as getVerifiableConsentGiven,
            getParentConsentRecord,
            recordParentConsent,
            type VerifiableParentConsent,
          } from './consent-record';
          """
          if eager not in source:
            raise SystemExit('expected eager consent import not found')
          source = source.replace(eager, '')

          old = """export async function getParentConsent(): Promise<VerifiableParentConsent | null> {
            return getParentConsentRecord();
          }

          export async function getConsentGiven(): Promise<boolean> {
            return getVerifiableConsentGiven();
          }

          export async function setParentConsent(): Promise<void> {
            await recordParentConsent();
          }
          """

          new = """export async function getParentConsent(): Promise<import('./consent-record').VerifiableParentConsent | null> {
            const { getParentConsentRecord } = await import('./consent-record');
            return getParentConsentRecord();
          }

          export async function getConsentGiven(): Promise<boolean> {
            const { getConsentGiven: getVerifiableConsentGiven } = await import('./consent-record');
            return getVerifiableConsentGiven();
          }

          export async function setParentConsent(): Promise<void> {
            const { recordParentConsent } = await import('./consent-record');
            await recordParentConsent();
          }
          """

          if old not in source:
            raise SystemExit('expected eager delegation block not found')
          source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Commit only storage lazy-loading change
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)lib/storage.ts'
          git diff --check -- lib/storage.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/storage.ts
          git commit -m "fix(test): lazy-load authoritative consent storage"
          git push origin HEAD:release/exact-sha-remediation-2026-07-18

name: Beta Lockfile Repair

on:
  push:
    branches:
      - beta/readiness-2026-08-22
    paths:
      - .github/workflows/beta-lockfile-repair.yml
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beta-lockfile-repair
  cancel-in-progress: false

jobs:
  repair-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v7
        with:
          ref: beta/readiness-2026-08-22
          fetch-depth: 1

      - name: Setup Node from repository
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository npm major
        run: npm install --global npm@11

      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify package and lockfile are synchronized
        run: npm ci --ignore-scripts

      - name: Show lockfile-only diff
        run: |
          git status --short
          git diff -- package-lock.json
          test -z "$(git status --short | grep -v '^ M package-lock.json$' || true)"

      - name: Commit repaired lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize Expo SDK 55 package lock"
          git push origin HEAD:beta/readiness-2026-08-22

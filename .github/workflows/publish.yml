name: Publish to GitHub Packages

on:
  release:
    types: [created]

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@krosebrook'

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install dependencies and verify lockfile integrity
        run: bash scripts/npm-ci-retry.sh publish-npm-ci.log

      # Quality gates — a release must pass the same checks as CI before it publishes.
      - name: Run preflight checks
        run: npm run preflight

      - name: Run ESLint
        run: npm run lint -- --max-warnings=0

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Run component tests (Jest)
        run: npm run test:components
        env:
          CI: true

      - name: Security audit
        run: node scripts/audit-gate.mjs

      - name: Type check
        run: npm run typecheck

      - name: Build server
        run: npm run server:build

      - name: Publish package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

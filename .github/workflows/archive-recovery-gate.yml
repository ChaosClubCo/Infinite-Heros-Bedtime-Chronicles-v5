name: Archive Recovery Gate

on:
  push:
    branches: [deploy/archive-recovery-20260827]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-build-gate:
    name: Source Archive + GCP Build Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Pin repository npm major
        run: npm install --global npm@11

      - name: Audit tracked source tree
        shell: bash
        run: |
          set -euo pipefail
          echo "HEAD=$(git rev-parse HEAD)"
          echo "Tracked files=$(git ls-files | wc -l | tr -d ' ')"

          echo "== Tracked symlinks =="
          mapfile -t links < <(git ls-files -s | awk '$1 == "120000" {print $4}')
          if ((${#links[@]} == 0)); then
            echo "none"
          else
            printf '%s\n' "${links[@]}"
            for link in "${links[@]}"; do
              target="$(git show "HEAD:$link")"
              case "$target" in
                /*|../*|*/../*|*'/..')
                  echo "ERROR: symlink escapes repository: $link -> $target"
                  exit 1
                  ;;
              esac
              [[ -e "$link" ]] || { echo "ERROR: broken tracked symlink: $link -> $target"; exit 1; }
            done
          fi

          echo "== Tracked nested archives =="
          mapfile -t archives < <(git ls-files | grep -Ei '\.(zip|tar|tar\.gz|tgz|gz|bz2|xz|7z|rar)$' || true)
          ((${#archives[@]} == 0)) && echo "none" || printf '%s\n' "${archives[@]}"

          echo "== Oversized tracked files (>50 MiB) =="
          mapfile -t large < <(git ls-tree -r -l HEAD | awk '$4 > 52428800 {print $4 " bytes\t" $5}')
          if ((${#large[@]} == 0)); then
            echo "none"
          else
            printf '%s\n' "${large[@]}"
            exit 1
          fi

          echo "== Package manager roots =="
          managers=0
          [[ -f package-lock.json ]] && { echo "npm: package-lock.json"; managers=$((managers+1)); }
          [[ -f pnpm-lock.yaml ]] && { echo "pnpm: pnpm-lock.yaml"; managers=$((managers+1)); }
          [[ -f yarn.lock ]] && { echo "yarn: yarn.lock"; managers=$((managers+1)); }
          [[ -f bun.lock || -f bun.lockb ]] && { echo "bun: bun.lock/bun.lockb"; managers=$((managers+1)); }
          ((managers == 1)) || { echo "ERROR: expected exactly one package manager lockfile; found $managers"; exit 1; }

          echo "== Tracked generated/migration paths =="
          generated_regex='(^|/)(node_modules|dist|build|web-build|static-build|server_dist|coverage|\.expo|\.next|\.cache|tmp)(/|$)'
          mapfile -t generated < <(git ls-files | grep -E "$generated_regex" || true)
          if ((${#generated[@]} == 0)); then
            echo "none"
          else
            printf '%s\n' "${generated[@]}"
            exit 1
          fi

          echo "== Legacy Replit markers (informational) =="
          git ls-files | grep -E '(^|/)(\.replit|replit\.nix|server/replit_integrations)(/|$)' || echo "none"

      - name: Prove Git archive integrity
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/source.tar.gz" HEAD
          gzip -t "$RUNNER_TEMP/source.tar.gz"
          tar -tzf "$RUNNER_TEMP/source.tar.gz" >/dev/null
          git archive --format=zip --output="$RUNNER_TEMP/source.zip" HEAD
          unzip -t "$RUNNER_TEMP/source.zip" >/dev/null
          ls -lh "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/source.zip"
          sha256sum "$RUNNER_TEMP/source.tar.gz" "$RUNNER_TEMP/source.zip"

      - name: Clean locked install
        run: npm ci

      - name: Vite production build
        run: npm run build

      - name: Simulate Cloud Run-neutral build hook
        shell: bash
        run: |
          set -euo pipefail
          npm pkg set 'scripts.gcp-build=npm run expo:build:ci && npm run server:build'
          test "$(npm pkg get scripts.gcp-build)" = '"npm run expo:build:ci && npm run server:build"'

      - name: Cloud Run buildpack hook
        env:
          CI: 'true'
          EXPO_NO_TELEMETRY: '1'
        run: npm run gcp-build

      - name: Verify expected GCP outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f server_dist/index.js
          test -d static-build
          test -f static-build/index.html
          echo "server_dist/index.js: present"
          echo "static-build/index.html: present"
          du -sh server_dist static-build

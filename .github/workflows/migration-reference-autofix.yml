name: One-shot migration reference autofix

on:
  push:
    branches:
      - fix/migration-reference-integrity

permissions:
  contents: write

concurrency:
  group: migration-reference-autofix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v4
        with:
          ref: fix/migration-reference-integrity
          fetch-depth: 0

      - name: Replace obsolete migration references
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          root = Path('.')
          workflow = Path('.github/workflows/migration-reference-autofix.yml')
          regression_test = Path('__tests__/release/migration-reference-integrity.test.ts')

          old_sync = 'supabase/migrations/' + '0001_sync_tables.sql'
          new_sync = 'supabase/migrations/20260713000817_0001_sync_tables.sql'
          old_voice = 'supabase/migrations/' + '0002_voice_chat_retention.sql'
          old_voice_name = '0002_voice_chat_retention.sql'
          new_voice = 'supabase/migrations/20260719064500_voice_chat_retention.sql'
          new_voice_name = '20260719064500_voice_chat_retention.sql'

          excluded_directories = {
              '.git', '.expo', '.next', 'coverage', 'dist', 'node_modules',
              'server_dist', 'static-build'
          }
          searchable_extensions = {
              '.cjs', '.js', '.json', '.md', '.mjs', '.ts', '.tsx', '.yaml', '.yml'
          }

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path in {workflow, regression_test}:
                  continue
              if any(part in excluded_directories for part in path.parts):
                  continue
              if path.suffix not in searchable_extensions:
                  continue

              source = path.read_text(encoding='utf-8')
              updated = source.replace(old_sync, new_sync)
              updated = updated.replace(old_voice, new_voice)
              updated = updated.replace(old_voice_name, new_voice_name)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(path.as_posix())

          test_source = regression_test.read_text(encoding='utf-8')
          test_updated = test_source.replace(
              "'supabase/migrations/0001_sync_tables.sql'",
              "['supabase/migrations/', '0001_sync_tables.sql'].join('')",
          ).replace(
              "'supabase/migrations/0002_voice_chat_retention.sql'",
              "['supabase/migrations/', '0002_voice_chat_retention.sql'].join('')",
          )
          if test_updated != test_source:
              regression_test.write_text(test_updated, encoding='utf-8')
              changed.append(regression_test.as_posix())

          workflow.unlink()
          changed.append(workflow.as_posix() + ' (removed)')

          remaining = []
          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              if any(part in excluded_directories for part in path.parts):
                  continue
              if path.suffix not in searchable_extensions:
                  continue
              source = path.read_text(encoding='utf-8')
              if old_sync in source or old_voice in source:
                  remaining.append(path.as_posix())

          if remaining:
              raise SystemExit('obsolete migration references remain: ' + ', '.join(remaining))

          if not changed:
              raise SystemExit('autofix made no changes')

          print('Changed files:')
          for item in changed:
              print(f'- {item}')
          PY

      - name: Commit exact corrective change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: resolve migration references after #377'
          git push origin HEAD:fix/migration-reference-integrity

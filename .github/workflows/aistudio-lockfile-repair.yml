name: Temporary AI Studio Lockfile Repair

on:
  push:
    branches:
      - fix/aistudio-config-finalize
    paths:
      - .github/workflows/aistudio-lockfile-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/aistudio-config-finalize
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pin npm 11
        run: npm install --global npm@11

      - name: Regenerate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify synchronized lockfile installs cleanly
        run: npm ci --ignore-scripts

      - name: Prove only package-lock.json changed
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git status --short | awk '{print $2}')
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "package-lock.json" ]]; then
            printf 'Unexpected changed files:\n'
            git status --short
            exit 1
          fi

      - name: Commit synchronized lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile [lockfile-sync]"
          git push origin HEAD:fix/aistudio-config-finalize

name: Patch Story Auth Once

on:
  push:
    branches:
      - fix/production-anonymous-auth-story-20260814

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/production-anonymous-auth-story-20260814
          fetch-depth: 0

      - name: Patch story request to send Supabase bearer token
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/story.tsx')
          text = path.read_text()

          replacements = [
              (
                  'import { getApiUrl } from "@/lib/query-client";\n',
                  'import { getApiUrl } from "@/lib/query-client";\nimport { useAuth } from "@/lib/AuthContext";\n',
              ),
              (
                  '  const scrollRef = useRef<ScrollView>(null);\n',
                  '  const scrollRef = useRef<ScrollView>(null);\n  const { getIdToken } = useAuth();\n',
              ),
              (
                  '      const res = await fetch(url.toString(), {\n        method: "POST",\n        headers: { "Content-Type": "application/json" },\n        body: JSON.stringify(bodyData),\n      });',
                  '      const token = await getIdToken();\n      const res = await fetch(url.toString(), {\n        method: "POST",\n        headers: {\n          "Content-Type": "application/json",\n          ...(token ? { Authorization: `Bearer ${token}` } : {}),\n        },\n        body: JSON.stringify(bodyData),\n      });',
              ),
              (
                  '    childName,\n    clearSceneImage,\n  ]);',
                  '    childName,\n    clearSceneImage,\n    getIdToken,\n  ]);',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-story-auth-once.yml
          git add app/story.tsx
          git commit -m "fix: authenticate production story generation"
          git push origin HEAD:fix/production-anonymous-auth-story-20260814

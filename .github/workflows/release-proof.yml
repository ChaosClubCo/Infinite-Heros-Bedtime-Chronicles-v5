name: Release Proof

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string
      base_url:
        description: HTTPS URL of the deployed candidate
        required: true
        type: string
      proof_phase:
        description: Run automated proof first; use finalize only after manual evidence exists
        required: true
        default: automated
        type: choice
        options:
          - automated
          - finalize
      evidence_issue:
        description: Canonical GitHub issue number that receives run evidence
        required: true
        default: "370"
        type: string
      physical_device_evidence_url:
        description: Private evidence URL for the completed device matrix (finalize only)
        required: false
        type: string
      alert_notification_evidence_url:
        description: Private evidence URL proving the alert notification was received (finalize only)
        required: false
        type: string
      backup_restore_evidence_url:
        description: Private evidence URL for disposable backup/restore proof (finalize only)
        required: false
        type: string
      rollback_evidence_url:
        description: Private evidence URL for the rollback drill (finalize only)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-proof-${{ github.event.inputs.release_sha }}-${{ github.event.inputs.proof_phase }}
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ github.event.inputs.release_sha }}
  BASE_URL: ${{ github.event.inputs.base_url }}
  PROOF_PHASE: ${{ github.event.inputs.proof_phase }}
  EVIDENCE_ISSUE: ${{ github.event.inputs.evidence_issue }}

jobs:
  announce-run:
    name: Publish authoritative run record
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Validate routing inputs
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EVIDENCE_ISSUE" =~ ^[1-9][0-9]*$ ]]

      - name: Publish run URL immediately
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = Number(process.env.EVIDENCE_ISSUE);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                '## Release Proof started',
                '',
                `- Candidate: \`${process.env.RELEASE_SHA}\``,
                `- Phase: \`${process.env.PROOF_PHASE}\``,
                `- Run: ${runUrl}`,
                `- Automation identity: \`${context.actor}\``,
                `- Started: \`${new Date().toISOString()}\``,
                '',
                '**Release posture remains NO GO. This run does not grant release approval.**',
              ].join('\n'),
            });

  validate-candidate:
    name: Validate exact candidate and repository gates
    needs: announce-run
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Validate proof inputs
        env:
          DEVICE_EVIDENCE: ${{ github.event.inputs.physical_device_evidence_url }}
          ALERT_NOTIFICATION_EVIDENCE: ${{ github.event.inputs.alert_notification_evidence_url }}
          BACKUP_EVIDENCE: ${{ github.event.inputs.backup_restore_evidence_url }}
          ROLLBACK_EVIDENCE: ${{ github.event.inputs.rollback_evidence_url }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASE_URL" =~ ^https://[^[:space:]]+$ ]]
          if [[ "$PROOF_PHASE" == "finalize" ]]; then
            [[ "$DEVICE_EVIDENCE" =~ ^https://[^[:space:]]+$ ]]
            [[ "$ALERT_NOTIFICATION_EVIDENCE" =~ ^https://[^[:space:]]+$ ]]
            [[ "$BACKUP_EVIDENCE" =~ ^https://[^[:space:]]+$ ]]
            [[ "$ROLLBACK_EVIDENCE" =~ ^https://[^[:space:]]+$ ]]
          fi

      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Verify checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: bash scripts/npm-ci-retry.sh release-npm-ci.log

      - name: Run complete repository gates
        shell: bash
        run: |
          set -o pipefail
          {
            npm run preflight
            npm run lint
            npm test
            npm run test:components -- --runInBand
            npm run typecheck
            npm audit --audit-level=critical
            npm run server:build
            npm run expo:check
            npm run expo:build:ci
            git diff --check
          } 2>&1 | tee repository-gates.log

      - name: Record gate metadata and checksum
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('repository-gates-metadata.json', JSON.stringify({
            releaseSha: process.env.RELEASE_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            workflow: process.env.GITHUB_WORKFLOW,
            actor: process.env.GITHUB_ACTOR,
            recordedAt: new Date().toISOString(),
          }, null, 2));
          NODE
          sha256sum repository-gates.log repository-gates-metadata.json > repository-gates.sha256

      - name: Upload repository gate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-gates-${{ env.RELEASE_SHA }}
          path: |
            release-npm-ci.log
            repository-gates.log
            repository-gates-metadata.json
            repository-gates.sha256
          if-no-files-found: warn
          retention-days: 90

  deployed-smoke:
    name: Deployed SHA and HTTPS smoke
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch deployed health, privacy notice, and headers
        run: |
          set -o pipefail
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --dump-header health-headers.txt \
            "$BASE_URL/api/health" --output health.json 2>&1 | tee deployed-smoke.log
          curl --fail --silent --show-error --proto '=https' --tlsv1.2 \
            --dump-header privacy-headers.txt \
            "$BASE_URL/privacy" --output privacy.html 2>&1 | tee -a deployed-smoke.log
          test -s privacy.html

      - name: Verify deployed release SHA
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const health = JSON.parse(fs.readFileSync('health.json', 'utf8'));
          if (health.status !== 'ok') throw new Error('health status is not ok');
          if (health.releaseSha !== process.env.RELEASE_SHA) {
            throw new Error(`deployed SHA mismatch: expected ${process.env.RELEASE_SHA}, got ${health.releaseSha}`);
          }
          if (JSON.stringify(health).match(/token|secret|password|connectionString/i)) {
            throw new Error('health payload exposes a sensitive diagnostic field');
          }
          NODE

      - name: Record deployed-smoke checksum
        if: always()
        run: |
          touch deployed-smoke.log
          sha256sum health.json privacy.html health-headers.txt privacy-headers.txt deployed-smoke.log \
            > deployed-smoke.sha256 2>/dev/null || true

      - name: Upload deployed smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployed-smoke-${{ env.RELEASE_SHA }}
          path: |
            health.json
            privacy.html
            health-headers.txt
            privacy-headers.txt
            deployed-smoke.log
            deployed-smoke.sha256
          if-no-files-found: warn
          retention-days: 90

  eas-internal-android:
    name: EAS internal Android build
    if: ${{ github.event.inputs.proof_phase == 'finalize' }}
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: release-proof
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm install --global npm@11
      - run: bash scripts/npm-ci-retry.sh eas-npm-ci.log

      - name: Require Expo token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: test -n "$EXPO_TOKEN"

      - name: Build internal APK and wait for completion
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_RELEASE_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -o pipefail
          npx --yes eas-cli@16.0.0 build --platform android --profile preview \
            --non-interactive --wait --json | tee eas-build.json
          sha256sum eas-build.json > eas-build.sha256

      - name: Upload EAS evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eas-internal-build-${{ env.RELEASE_SHA }}
          path: |
            eas-npm-ci.log
            eas-build.json
            eas-build.sha256
          if-no-files-found: warn
          retention-days: 90

  sentry-ingestion:
    name: Sentry ingestion evidence
    if: ${{ github.event.inputs.proof_phase == 'finalize' }}
    needs: validate-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release-proof
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm install --global npm@11
      - run: bash scripts/npm-ci-retry.sh sentry-npm-ci.log

      - name: Send and flush test event
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          test -n "$SENTRY_DSN"
          node <<'NODE'
          const fs = require('node:fs');
          const Sentry = require('@sentry/node');
          (async () => {
            Sentry.init({ dsn: process.env.SENTRY_DSN, release: process.env.RELEASE_SHA });
            const eventId = Sentry.captureMessage('Bedtime Chronicles release-proof alert', 'warning');
            const flushed = await Sentry.flush(15000);
            if (!flushed) throw new Error('Sentry event did not flush');
            fs.writeFileSync('sentry-event.json', JSON.stringify({
              eventId,
              release: process.env.RELEASE_SHA,
              environment: 'release-proof',
              ingestedAt: new Date().toISOString(),
              notificationEvidenceStatus: 'pending-human-receipt',
            }, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          sha256sum sentry-event.json > sentry-event.sha256

      - name: Upload Sentry ingestion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentry-ingestion-${{ env.RELEASE_SHA }}
          path: |
            sentry-npm-ci.log
            sentry-event.json
            sentry-event.sha256
          if-no-files-found: warn
          retention-days: 90

  evidence-manifest:
    name: Build machine-readable evidence manifest
    needs: [validate-candidate, deployed-smoke, eas-internal-android, sentry-ingestion]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build evidence manifest
        env:
          VALIDATE_RESULT: ${{ needs.validate-candidate.result }}
          SMOKE_RESULT: ${{ needs.deployed-smoke.result }}
          EAS_RESULT: ${{ needs.eas-internal-android.result }}
          SENTRY_RESULT: ${{ needs.sentry-ingestion.result }}
          DEVICE_EVIDENCE: ${{ github.event.inputs.physical_device_evidence_url }}
          ALERT_NOTIFICATION_EVIDENCE: ${{ github.event.inputs.alert_notification_evidence_url }}
          BACKUP_EVIDENCE: ${{ github.event.inputs.backup_restore_evidence_url }}
          ROLLBACK_EVIDENCE: ${{ github.event.inputs.rollback_evidence_url }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const manifest = {
            schemaVersion: 2,
            releaseSha: process.env.RELEASE_SHA,
            baseUrl: process.env.BASE_URL,
            proofPhase: process.env.PROOF_PHASE,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            runUrl,
            actor: process.env.GITHUB_ACTOR,
            recordedAt: new Date().toISOString(),
            jobs: {
              repositoryGates: process.env.VALIDATE_RESULT,
              deployedSmoke: process.env.SMOKE_RESULT,
              easInternalAndroid: process.env.EAS_RESULT,
              sentryIngestion: process.env.SENTRY_RESULT,
            },
            manualEvidence: {
              physicalDeviceEvidenceUrl: process.env.DEVICE_EVIDENCE || null,
              alertNotificationEvidenceUrl: process.env.ALERT_NOTIFICATION_EVIDENCE || null,
              backupRestoreEvidenceUrl: process.env.BACKUP_EVIDENCE || null,
              rollbackEvidenceUrl: process.env.ROLLBACK_EVIDENCE || null,
            },
            releaseApproval: 'not_granted',
          };
          if (manifest.proofPhase === 'finalize') {
            for (const [key, value] of Object.entries(manifest.manualEvidence)) {
              if (!value || !/^https:\/\//.test(value)) throw new Error(`${key} must be an HTTPS evidence URL`);
            }
          }
          fs.writeFileSync('release-evidence.json', JSON.stringify(manifest, null, 2));
          NODE
          sha256sum release-evidence.json > release-evidence.sha256

      - name: Upload release evidence manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-manifest-${{ env.RELEASE_SHA }}
          path: |
            release-evidence.json
            release-evidence.sha256
          if-no-files-found: error
          retention-days: 180

  report-results:
    name: Attach proof result to evidence ledger
    needs: evidence-manifest
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Comment canonical evidence issue
        uses: actions/github-script@v9
        with:
          script: |
            const issueNumber = Number(process.env.EVIDENCE_ISSUE);
            if (!Number.isInteger(issueNumber) || issueNumber < 1) {
              core.setFailed('EVIDENCE_ISSUE must be a positive issue number');
              return;
            }
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Automated Release Proof result',
              '',
              `- Candidate: \`${process.env.RELEASE_SHA}\``,
              `- Phase: \`${process.env.PROOF_PHASE}\``,
              `- Evidence manifest job: **${{ needs.evidence-manifest.result }}**`,
              `- Workflow run: ${runUrl}`,
              '',
              process.env.PROOF_PHASE === 'finalize'
                ? '**Finalization evidence was collected, but promotion remains NO GO until independent review and explicit release-owner approval.**'
                : '**Automated phase only. Release remains NO GO; EAS, received-alert, device, restore, rollback, archive, and legal evidence remain separate gates.**',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body,
            });

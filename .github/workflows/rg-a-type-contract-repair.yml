name: RG-A Type Contract Repair

on:
  push:
    branches:
      - repair/rg-a-rg-b-baseline
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: repair/rg-a-rg-b-baseline
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Apply fail-closed contract repairs
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          galaxy_path = Path('src/components/StoryGalaxyMap.tsx')
          galaxy = galaxy_path.read_text()

          interface_anchor = """interface ConstellationSector {
  id: string;
  storyId?: string;
  constellationName: string;
  heroName: string;
  heroColor: string;
  iconName: string;
  theme: string;
  defaultTitle: string;
  summary: string;
  affirmation: string;
  x: number;
  y: number;
  sectorName: string;
  coverImage?: string;
  audioDurationMinutes?: number;
}
"""
          derived_interface = interface_anchor + """
interface MappedConstellationSector extends ConstellationSector {
  isCompleted: boolean;
  isNextTarget: boolean;
  completedRecord?: CompletedStoryRecord;
  orderNumber: number;
}
"""

          replacements = [
              (interface_anchor, derived_interface),
              ("useState<ConstellationSector | null>(null)", "useState<MappedConstellationSector | null>(null)"),
              ("const mappedSectors = useMemo(() => {", "const mappedSectors = useMemo<MappedConstellationSector[]>(() => {"),
              ("const handleSectorClick = (sector: typeof mappedSectors[0]) => {", "const handleSectorClick = (sector: MappedConstellationSector) => {"),
          ]

          for old, new in replacements:
              count = galaxy.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one StoryGalaxyMap match, found {count}: {old[:80]!r}')
              galaxy = galaxy.replace(old, new, 1)

          galaxy_path.write_text(galaxy)

          badges_path = Path('src/data/badges.ts')
          badges = badges_path.read_text()
          old = "if (story.mode === 'madlibs' || story.isMadlibs) {"
          new = "if (story.mode === 'madlibs') {"
          count = badges.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one badges match, found {count}')
          badges_path.write_text(badges.replace(old, new, 1))
          PY

          git diff --check
          git diff -- src/components/StoryGalaxyMap.tsx src/data/badges.ts

      - name: Install locked dependencies
        run: npm ci

      - name: Prove lint and typecheck
        run: |
          npm run lint -- --max-warnings=0
          npm run typecheck

      - name: Commit verified contract repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/StoryGalaxyMap.tsx src/data/badges.ts
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix(rg-a): repair derived story contracts"
          git push origin HEAD:repair/rg-a-rg-b-baseline

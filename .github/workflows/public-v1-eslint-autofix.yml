name: Public-v1 ESLint Autofix

on:
  push:
    branches:
      - release/public-v1-expo-freeze-20260827
    paths:
      - .github/workflows/public-v1-eslint-autofix.yml

permissions:
  contents: write

concurrency:
  group: public-v1-eslint-autofix
  cancel-in-progress: false

jobs:
  eslint-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          ref: release/public-v1-expo-freeze-20260827
          fetch-depth: 0

      - name: Setup repository Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Install locked dependencies
        run: npm ci

      - name: Apply deterministic ESLint fixes
        run: npm run lint:fix

      - name: Strip autofix-introduced trailing whitespace
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/[[:space:]]\+$//' __tests__/release-provenance.test.ts api/server.mjs

      - name: Reject malformed patch output
        run: git diff --check

      - name: Verify manifests and lockfile were not modified
        run: git diff --exit-code -- package.json package-lock.json

      - name: Commit autofixes when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No ESLint autofixes produced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(release): apply deterministic ESLint autofixes after source recovery"
          git push origin HEAD:release/public-v1-expo-freeze-20260827

      - name: Report remaining zero-warning gate
        run: npm run lint -- --max-warnings=0


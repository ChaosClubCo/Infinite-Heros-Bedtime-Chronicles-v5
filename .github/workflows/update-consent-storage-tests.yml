name: Update consent storage tests

on:
  push:
    branches:
      - release/exact-sha-remediation-2026-07-18

permissions:
  contents: write

concurrency:
  group: update-consent-storage-tests
  cancel-in-progress: false

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/exact-sha-remediation-2026-07-18
          fetch-depth: 1

      - name: Update legacy consent tests to v3 attestation
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('lib/storage.test.ts')
          source = path.read_text()

          async_storage_end = """}));

          // Mock the constants/types module
          """
          crypto_mock = """}));

          // The authoritative consent module hashes disclosure copy with Expo Crypto.
          // Mock only that boundary so Node-only storage tests do not load React Native.
          vi.mock('expo-crypto', () => ({
            CryptoDigestAlgorithm: { SHA256: 'SHA-256' },
            digestStringAsync: vi.fn(() => Promise.resolve('a'.repeat(64))),
          }));

          // Mock the constants/types module
          """
          if async_storage_end not in source:
            raise SystemExit('AsyncStorage mock anchor not found')
          source = source.replace(async_storage_end, crypto_mock, 1)

          source = source.replace(
          """  DEFAULT_PARENT_CONSENT: { consented: false, consentedAt: 0, version: 0 },
            CONSENT_VERSION: 1,
          """,
          "",
          )

          old = """describe('parental consent', () => {
            it('reports no consent by default', async () => {
              const consent = await getParentConsent();
              expect(consent.consented).toBe(false);
              expect(await getConsentGiven()).toBe(false);
            });

            it('records consent for the current version', async () => {
              await setParentConsent();
              const consent = await getParentConsent();
              expect(consent.consented).toBe(true);
              expect(consent.version).toBe(1);
              expect(consent.consentedAt).toBeGreaterThan(0);
              expect(await getConsentGiven()).toBe(true);
            });

            it('treats a stale consent version as not consented', async () => {
              mockStorage['@infinity_heroes_parent_consent'] = JSON.stringify({
                consented: true,
                consentedAt: 123,
                version: 0,
              });
              expect(await getConsentGiven()).toBe(false);
            });
          });
          """

          new = """describe('parental consent compatibility exports', () => {
            it('reports no consent by default', async () => {
              expect(await getParentConsent()).toBeNull();
              expect(await getConsentGiven()).toBe(false);
            });

            it('records the complete current verifiable consent record', async () => {
              await setParentConsent();
              const consent = await getParentConsent();
              expect(consent).toMatchObject({
                consented: true,
                version: 3,
                contentHash: 'a'.repeat(64),
                verificationMethod: 'parent_gate_arithmetic_v1',
              });
              expect(consent?.consentedAt).toBeGreaterThan(0);
              expect(consent?.locale.length).toBeGreaterThan(0);
              expect(await getConsentGiven()).toBe(true);
            });

            it('treats a legacy version-only consent record as not consented', async () => {
              mockStorage['@infinity_heroes_parent_consent'] = JSON.stringify({
                consented: true,
                consentedAt: 123,
                version: 2,
              });
              expect(await getParentConsent()).toBeNull();
              expect(await getConsentGiven()).toBe(false);
            });
          });
          """

          if old not in source:
            raise SystemExit('legacy parental consent test block not found')
          source = source.replace(old, new)
          path.write_text(source)
          PY

      - name: Commit only the consent test update
        run: |
          set -euo pipefail
          git diff --exit-code -- . ':(exclude)lib/storage.test.ts'
          git diff --check -- lib/storage.test.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/storage.test.ts
          git commit -m "test(privacy): align storage consent tests with v3"
          git push origin HEAD:release/exact-sha-remediation-2026-07-18

name: Sync repair lockfile

on:
  push:
    branches:
      - fix/restore-node-runtime-pin
    paths:
      - .github/workflows/sync-repair-lock.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: sync-repair-lockfile
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v7
        with:
          ref: fix/restore-node-runtime-pin
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit synchronized lockfile if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(ci): synchronize package lock under npm 11"
          git push origin HEAD:fix/restore-node-runtime-pin

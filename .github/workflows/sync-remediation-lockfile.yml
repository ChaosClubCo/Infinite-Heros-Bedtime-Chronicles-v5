name: Sync remediation lockfile

on:
  push:
    branches:
      - release/exact-sha-remediation-20260718
    paths:
      - package.json
      - .github/workflows/sync-remediation-lockfile.yml

permissions:
  contents: write

concurrency:
  group: sync-remediation-lockfile
  cancel-in-progress: false

jobs:
  sync-lockfile:
    name: Generate reviewed React Native lockfile update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v7
        with:
          ref: release/exact-sha-remediation-20260718
          fetch-depth: 0

      - name: Verify controlled manifest target
        run: |
          test "$(node -p "require('./package.json').dependencies['react-native']")" = "0.83.6"
          test "$(node -p "require('./package.json').dependencies.expo")" = "~55.0.28"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install repository npm version
        run: npm install --global npm@11

      - name: Synchronize only the controlled dependency migration
        run: npm install --package-lock-only --ignore-scripts --save-exact react-native@0.83.6

      - name: Reject unexpected manifest changes
        run: git diff --exit-code -- package.json

      - name: Verify locked install and Expo compatibility
        run: |
          npm ci
          npm run expo:check

      - name: Commit generated lockfile when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): synchronize Expo 55 lockfile"
          git push origin HEAD:release/exact-sha-remediation-20260718

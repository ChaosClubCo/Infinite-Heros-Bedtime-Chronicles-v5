version: 2
updates:
  # npm package updates — monthly, all grouped into one PR to reduce noise
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    reviewers:
      - "Krosebrook"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Bundle all minor/patch updates into a single PR
      all-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Expo SDK major versions require coordinated upgrades — all expo-* packages
      # must be upgraded together with the Expo SDK to avoid peer-dependency skew.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      # drizzle-orm major upgrade requires schema migration
      - dependency-name: "drizzle-orm"
        update-types: ["version-update:semver-major"]
      # @sentry/react-native and react-native-gesture-handler must track the
      # version Expo SDK 55 bundles — a bare Dependabot major bump (#406, #407)
      # previously overshot the Expo-supported range and broke `expo:check` CI
      - dependency-name: "@sentry/react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-gesture-handler"
        update-types: ["version-update:semver-major"]

  # GitHub Actions updates — monthly, grouped into one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 2
    reviewers:
      - "Krosebrook"
    labels:
      - "dependencies"
      - "github-actions"
      - "automated"
    groups:
      all-actions:
        patterns:
          - "*"
